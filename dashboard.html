<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="assets/css/style.css"><title>Owner Dashboard</title></head><body><header class="topbar"><a class="brand" href="index.html">⚡ BizNest</a><div class="nav-actions"><button id="openSite" class="btn">Open Public Site</button><button id="logout" class="btn dark">Logout</button></div></header><main class="wrap"><h1>Owner Dashboard</h1><p id="welcome"></p><div class="tabs"><button class="tab active" data-tab="business">Business</button><button class="tab" data-tab="products">Products</button><button class="tab" data-tab="services">Services</button><button class="tab" data-tab="requests">Orders & Bookings</button></div><section id="business" class="panel active"><div class="card"><h2>Business Profile</h2><input id="businessName" class="input" placeholder="Business name"><input id="slug" class="input" placeholder="Public URL name"><input id="tagline" class="input" placeholder="Tagline"><input id="phone" class="input" placeholder="Phone"><input id="businessEmail" class="input" placeholder="Business email"><input id="address" class="input" placeholder="Address"><input id="logoFile" class="input" type="file" accept="image/*"><img id="logoPreview" class="logo-preview hidden"><button id="saveBusiness" class="btn orange">Save Business</button><p id="businessMsg" class="msg"></p></div></section><section id="products" class="panel"><div class="card"><h2>Add Product</h2><input id="productName" class="input" placeholder="Product name"><input id="productPrice" class="input" type="number" placeholder="Price"><textarea id="productDescription" class="input" placeholder="Description"></textarea><input id="productImage" class="input" type="file" accept="image/*"><button id="addProduct" class="btn orange">Add Product</button><p id="productMsg"></p></div><div id="productList" class="grid"></div></section><section id="services" class="panel"><div class="card"><h2>Add Service</h2><input id="serviceName" class="input" placeholder="Service name"><input id="servicePrice" class="input" type="number" placeholder="Price"><textarea id="serviceDescription" class="input" placeholder="Description"></textarea><button id="addService" class="btn orange">Add Service</button><p id="serviceMsg"></p></div><div id="serviceList" class="grid"></div></section><section id="requests" class="panel"><h2>Orders & Bookings</h2><div id="requestList" class="grid"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script src="assets/js/dashboard.js"></script></body></html>
