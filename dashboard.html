<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Dashboard</title><link rel="stylesheet" href="assets/css/style.css"></head><body><nav class="nav"><div class="brand">⚡ BizNest Owner Panel</div><div class="row"><button id="openSite" class="btn orange">Open Public Site</button><button id="logout" class="btn">Logout</button></div></nav><main class="wrap"><div id="msg"></div><div class="tabs"><button class="btn orange" onclick="show('business')">Business</button><button class="btn" onclick="show('products')">Products</button><button class="btn" onclick="show('services')">Services</button><button class="btn" onclick="show('requests')">Orders & Bookings</button></div>
<section id="business"><div class="card"><h2>Business Information</h2><input id="bname" class="input" placeholder="Business name"><input id="slug" class="input" placeholder="Business URL name e.g. my-shop"><input id="tagline" class="input" placeholder="Tagline"><input id="phone" class="input" placeholder="Phone"><input id="bemail" class="input" placeholder="Business email"><textarea id="address" placeholder="Address"></textarea><button id="saveBusiness" class="btn orange">Save Business & Create Website</button></div></section>
<section id="products" class="hidden"><div class="card"><h2>Add Product</h2><input id="pname" class="input" placeholder="Product name"><textarea id="pdesc" placeholder="Description"></textarea><input id="pprice" class="input" type="number" placeholder="Price"><input id="pimage" class="input" placeholder="Image URL (optional)"><button id="addProduct" class="btn orange">Add Product</button></div><br><div id="productList" class="grid"></div></section>
<section id="services" class="hidden"><div class="card"><h2>Add Service</h2><input id="sname" class="input" placeholder="Service name"><textarea id="sdesc" placeholder="Description"></textarea><input id="sprice" class="input" type="number" placeholder="Price"><button id="addService" class="btn orange">Add Service</button></div><br><div id="serviceList" class="grid"></div></section>
<section id="requests" class="hidden"><div id="requestList"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script src="assets/js/dashboard.js"></script></body></html>
