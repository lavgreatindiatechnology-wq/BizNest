<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="assets/css/style.css"><title>Owner Dashboard</title></head><body><nav class="nav"><div class="container nav-inner"><a class="brand" href="index.html">⚡ Biz<span>Nest</span></a><div class="nav-actions"><span id="welcome" class="muted"></span><button id="logout" class="btn dark">Logout</button></div></div></nav><main class="container section"><h1>Owner Dashboard</h1><div class="tabs"><button class="tab active" data-tab="business">Business</button><button class="tab" data-tab="products">Products</button><button class="tab" data-tab="services">Services</button><button class="tab" data-tab="requests">Orders & Bookings</button></div><section id="business" class="panel active"><div class="two"><div class="card"><h2>Business Profile</h2><label>Name<input id="bname" class="input"></label><label>Public Slug<input id="bslug" class="input" placeholder="india-fishon-shop"></label><label>Tagline<input id="btagline" class="input"></label><label>Phone<input id="bphone" class="input"></label><label>Address<textarea id="baddress" class="textarea"></textarea></label><label>Logo Image URL<input id="blogo" class="input"></label><button id="saveBusiness" class="btn primary" style="margin-top:16px">Save Business</button><div id="businessMsg" class="msg"></div></div><div class="card"><h2>Public Website</h2><p id="publicLink" class="muted">Save your business first.</p><a id="openPublic" target="_blank" class="btn light hidden">Open Public Site</a></div></div></section><section id="products" class="panel"><div class="two"><div class="card"><h2>Add Product</h2><label>Name<input id="pname" class="input"></label><label>Price<input id="pprice" class="input" type="number"></label><label>Description<textarea id="pdesc" class="textarea"></textarea></label><label>Image URL<input id="pimage" class="input"></label><button id="addProduct" class="btn primary" style="margin-top:16px">Add Product</button><div id="productMsg" class="msg"></div></div><div><h2>Your Products</h2><div id="productList"></div></div></div></section><section id="services" class="panel"><div class="two"><div class="card"><h2>Add Service</h2><label>Name<input id="sname" class="input"></label><label>Price<input id="sprice" class="input" type="number"></label><label>Description<textarea id="sdesc" class="textarea"></textarea></label><button id="addService" class="btn primary" style="margin-top:16px">Add Service</button><div id="serviceMsg" class="msg"></div></div><div><h2>Your Services</h2><div id="serviceList"></div></div></div></section><section id="requests" class="panel"><h2>Orders & Bookings</h2><div id="requestList" class="cards"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/dashboard.js"></script></body></html>
