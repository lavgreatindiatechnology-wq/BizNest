<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../assets/css/style.css"><title>Customer Login</title></head><body class="customer-page"><div class="customer-wrap"><div class="authbox" style="margin:auto"><div class="brand"><span class="mark">C</span>Customer Portal</div><h2>Login or Create Customer Account</h2><p class="muted">Orders, service requests और appointments देखने के लिए login करें।</p><form onsubmit="customerAuth(event)"><input id="cname" class="input" placeholder="Your Name" required><input id="cphone" class="input" placeholder="Mobile Number" required><input id="cemail" class="input" type="email" placeholder="Email (optional)"><button class="btn" style="width:100%">Continue as Customer</button></form><p id="cmsg"></p><p><a id="backLink" href="business.html">← Back to Business Website</a></p></div></div><script src="../assets/js/store.js"></script><script>function customerAuth(e){e.preventDefault();let bid=Number(new URLSearchParams(location.search).get('business')),d=db(),phone=cphone.value.trim(),c=d.customers.find(x=>x.businessId===bid&&x.phone===phone);if(!c){c={id:sid(),businessId:bid,name:cname.value.trim(),phone,email:cemail.value.trim(),createdAt:new Date().toLocaleString()};d.customers.push(c);save(d)}else{c.name=cname.value.trim();save(d)}setCustomer(c);location.href='customer-dashboard.html?business='+bid}document.addEventListener('DOMContentLoaded',()=>{let q=location.search;backLink.href='business.html'+q})</script></body></html>
