<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../assets/css/style.css"><title>My Orders</title></head><body class="customer-page"><div class="customer-wrap"><div class="customer-head"><div><div class="brand"><span class="mark">C</span>My Customer Account</div><h2 id="welcome"></h2></div><div><a id="shopLink" class="btn alt">Continue Shopping</a> <button class="btn danger" onclick="customerLogout()">Logout</button></div></div><div class="feature-banner"><h2>My Orders & Service Requests</h2><p id="sessionInfo"></p><p>आपके सभी orders, appointment और service requests यहाँ दिखाई देंगे।</p></div><h2>🛒 My Orders</h2><div id="myOrders"></div><h2>📅 My Service Requests</h2><div id="myRequests"></div></div><script src="../assets/js/store.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{let bid=Number(new URLSearchParams(location.search).get('business')),c=customer(),d=db();if(!c||c.businessId!==bid){location.href='customer-login.html?business='+bid;return}welcome.textContent='Welcome, '+c.name;let hrs=Math.max(0,Math.ceil((c.expiresAt-Date.now())/3600000));sessionInfo.textContent='🔒 आपका login active है · लगभग '+hrs+' घंटे बाकी';shopLink.href='business.html?business='+bid;let os=d.orders.filter(x=>x.businessId===bid&&x.customerId===c.id),rs=d.requests.filter(x=>x.businessId===bid&&x.customerId===c.id);myOrders.innerHTML=os.length?os.map(x=>`<div class=order-card><b>${esc(x.productName)}</b><p>Quantity: ${x.quantity} · ₹${x.price}</p><span class=status-pill>${esc(x.status)}</span><p class=muted>${esc(x.createdAt)}</p></div>`).join(''):'<div class=empty-state>No orders yet.</div>';myRequests.innerHTML=rs.length?rs.map(x=>`<div class=order-card><b>${esc(x.serviceName)}</b><p>Appointment: ${esc(x.appointment)}</p><span class=status-pill>${esc(x.status)}</span><p class=muted>${esc(x.createdAt)}</p></div>`).join(''):'<div class=empty-state>No service requests yet.</div>'})</script></body></html>
