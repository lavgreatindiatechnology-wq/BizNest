<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BizBoost AI - Login</title>

  <link rel="stylesheet" href="assets/css/style.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body class="auth">

  <div class="authbox">

    <h2>🟠 BizBoost AI Login</h2>

    <form id="loginForm">

      <input
        id="email"
        class="input"
        type="email"
        placeholder="Email"
        required
      >

      <input
        id="password"
        class="input"
        type="password"
        placeholder="Password"
        required
      >

      <button
        type="submit"
        class="btn"
        style="width:100%"
      >
        Login
      </button>

    </form>

    <p id="msg"></p>

    <p>
      Don't have an account?
      <a href="register.html">
        Create new account
      </a>
    </p>

  </div>

  <!-- JavaScript -->
  <script src="assets/js/config.js"></script>

  <script src="assets/js/auth.js"></script>

</body>
</html>
