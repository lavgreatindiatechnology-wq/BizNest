<!doctype html><html><head><meta name="viewport" content="width=device-width"><title>Customer Account | BizNest</title><link rel="stylesheet" href="assets/css/style.css"></head><body><header class="customer-head"><div class="container nav"><a id="back" class="logo">← <i>BizNest</i></a><button id="logoutBtn" class="btn btn-dark hidden">Logout</button></div></header><main class="container section"><div id="authBox" class="auth-card" style="margin:auto"><h1>Customer Account</h1><p>Login or create an account to place orders and book appointments.</p><label>Name (for new account)<input id="regName" class="input"></label><label>Email<input id="email" class="input" type="email"></label><label>Password<input id="password" class="input" type="password"></label><div class="hero-actions"><button id="loginBtn" class="btn btn-dark">Login</button><button id="registerBtn" class="btn btn-primary">Register</button></div><div id="msg" class="notice"></div></div>
