<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="assets/css/style.css"><title>Customer</title></head><body><nav class="nav"><div class="container nav-inner"><a id="back" class="brand">← Back to Shop</a><button id="logout" class="btn dark hidden">Logout</button></div></nav><main class="container section"><div id="authSection" class="center card"><h2>Customer Login / Register</h2><label>Name (for registration)<input id="customerName" class="input"></label><label>Email<input id="email" class="input" type="email"></label><label>Password<input id="password" class="input" type="password"></label><div class="actions" style="margin-top:18px"><button id="login" class="btn dark">Login</button><button id="signup" class="btn primary">Create Account</button></div><div id="msg" class="msg"></div></div><div id="requestSection" class="hidden"><h2 id="welcomeCustomer"></h2><div class="two"><div class="card"><h2 id="title">Customer Request</h2><p id="requestInfo" class="msg"></p><label>Your Name<input id="cname" class="input"></label><label>Phone<input id="cphone" class="input"></label><label>Note<textarea id="note" class="textarea"></textarea></label><button id="send" class="btn primary" style="margin-top:18px">Submit</button><div id="done" class="msg"></div></div><div class="card"><h2>Account History</h2><div id="historyList"></div></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/customer.js"></script></body></html>
