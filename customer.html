<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Customer - BizNest</title>

<link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<nav class="nav">
    <a id="back" class="brand" href="index.html">
        ← Back to Business
    </a>
</nav>

<main class="wrap" style="max-width:650px">

    <div class="card">

        <h1 id="title">Customer Login</h1>

        <!-- LOGIN / REGISTER SECTION -->
        <div id="authSection">

            <input
                id="customerName"
                class="input"
                type="text"
                placeholder="Your Name (Required for new account)"
            >

            <input
                id="email"
                class="input"
                type="email"
                placeholder="Email Address"
            >

            <input
                id="password"
                class="input"
                type="password"
                placeholder="Password"
            >

            <div class="row">
                <button id="login" class="btn orange">
                    Login
                </button>

                <button id="signup" class="btn">
                    Create Account
                </button>
            </div>

            <p id="msg" class="msg"></p>

        </div>


        <!-- ORDER / BOOKING FORM -->
        <div id="requestSection" class="hidden">

            <h2 id="welcomeCustomer">
                Welcome Customer
            </h2>

            <p id="requestInfo" class="small"></p>

            <input
                id="cname"
                class="input"
                type="text"
                placeholder="Your Name"
            >

            <input
                id="cphone"
                class="input"
                type="tel"
                placeholder="Phone Number"
            >

            <textarea
                id="note"
                placeholder="Write your message or requirement"
            ></textarea>

            <div class="row">

                <button id="send" class="btn orange">
                    Send Request
                </button>

                <button id="logout" class="btn">
                    Logout
                </button>

            </div>

            <p id="done" class="msg"></p>

        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/config.js"></script>

<script src="assets/js/customer.js"></script>

</body>
</html>
