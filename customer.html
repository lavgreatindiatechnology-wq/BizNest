<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Login</title><link rel="stylesheet" href="assets/css/style.css"></head><body><nav class="nav"><a id="back" class="brand" href="index.html">← Back to Business</a></nav><main class="wrap" style="max-width:620px"><div class="card"><h1 id="title">Customer Login</h1><div id="auth"><input id="email" class="input" type="email" placeholder="Customer Email"><input id="password" class="input" type="password" placeholder="Password"><div class="row"><button id="login" class="btn orange">Login</button><button id="signup" class="btn">Create Customer Account</button></div><p id="msg" class="msg"></p></div><div id="form" class="hidden"><h2>Send Your Request</h2><input id="cname" class="input" placeholder="Your Name"><input id="cphone" class="input" placeholder="Phone Number"><textarea id="note" placeholder="Message / requirement"></textarea><div class="row"><button id="send" class="btn orange">Send Request</button><button id="logout" class="btn">Logout</button></div><p id="done" class="msg"></p></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script src="assets/js/customer.js"></script></body></html>
