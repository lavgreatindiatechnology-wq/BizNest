<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BizNest Admin Panel</title>
<link rel="stylesheet" href="assets/css/style.css">
</head><body>
<nav class="nav"><div class="brand">⚡ BizNest Admin Panel</div><button id="logout" class="btn">Logout</button></nav>
<main class="wrap">
<h1>Admin Dashboard</h1>
<p id="msg" class="small"></p>
<div class="grid">
  <div class="card"><h3>Total Businesses</h3><h2 id="businessCount">-</h2></div>
  <div class="card"><h3>Total Customer Requests</h3><h2 id="requestCount">-</h2></div>
</div>
<br>
<div class="card"><h2>Businesses</h2><div id="businessList"></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
async function init(){
 const u=(await sb.auth.getUser()).data.user;
 if(!u){location.href="admin-login.html";return;}
 const profile=await sb.from("profiles").select("role").eq("id",u.id).maybeSingle();
 if(!profile.data||profile.data.role!=="admin"){await sb.auth.signOut();location.href="admin-login.html";return;}
 const b=await sb.from("businesses").select("*").order("created_at",{ascending:false});
 const r=await sb.from("requests").select("*");
 businessCount.textContent=(b.data||[]).length;
 requestCount.textContent=(r.data||[]).length;
 businessList.innerHTML=(b.data||[]).map(x=>`<div class="card" style="margin:10px 0"><b>${x.name}</b><br><span class="small">Slug: ${x.slug}</span></div>`).join("")||"No businesses yet.";
}
logout.onclick=async()=>{await sb.auth.signOut();location.href="index.html"};init();
</script></body></html>
