<!doctype html><html><head><meta name="viewport" content="width=device-width"><title>Admin Login | BizNest</title><link rel="stylesheet" href="assets/css/style.css"></head><body><div class="auth-wrap"><div class="auth-card"><a class="logo" href="index.html"><i>⚡</i> BizNest</a><h1>Admin Login</h1><p>Admin accounts are managed separately in Supabase.</p><label>Email<input id="email" class="input" type="email"></label><label>Password<input id="password" class="input" type="password"></label><button id="adminLogin" class="btn btn-dark" style="width:100%;margin-top:20px">Admin Login</button><div id="msg" class="notice"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script>const $=x=>document.getElementById(x);$("adminLogin").onclick=async()=>{const{data,error}=await sb.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error)return $("msg").textContent="❌ "+error.message;if(data.user.user_metadata?.role!=="admin"){await sb.auth.signOut();$("msg").textContent="❌ This account is not an admin account";return}$("msg").textContent="✅ Admin login successful"};</script></body></html>
