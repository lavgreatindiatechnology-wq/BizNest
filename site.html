<!doctype html>

<html>

<head>

<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1"
>

<title>Business Website</title>

<link
rel="stylesheet"
href="assets/css/style.css"
>

</head>


<body>


<nav class="nav">

<div class="row">

<img
id="businessLogo"
class="hidden"
style="
width:52px;
height:52px;
border-radius:14px;
object-fit:cover;
"
>

<div id="brand" class="brand">
Business
</div>

</div>


<div class="row">

<a href="#products">
Products
</a>

<a href="#services">
Services
</a>

<a
id="customerLogin"
class="btn orange"
>
Customer Login
</a>

</div>

</nav>


<div id="loading" class="wrap">

Loading business website...

</div>


<main id="app" class="hidden">


<section class="hero">

<div class="wrap">


<div class="row">

<img
id="heroLogo"
class="hidden"
style="
width:110px;
height:110px;
border-radius:24px;
object-fit:cover;
background:white;
padding:5px;
"
>

<div>

<h1 id="name"></h1>

<p id="tag"></p>

<p
id="contact"
class="small"
></p>

</div>

</div>

</div>

</section>


<section
id="products"
class="wrap"
>

<h2>🛍️ Our Products</h2>

<div
id="plist"
class="grid"
></div>

</section>


<section
id="services"
class="wrap"
>

<h2>🛠️ Our Services</h2>

<div
id="slist"
class="grid"
></div>

</section>


<section class="wrap">

<div class="card">

<h2>📍 Contact & Address</h2>

<p id="addr"></p>

</div>

</section>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/config.js"></script>

<script src="assets/js/site.js"></script>


</body>

</html>
